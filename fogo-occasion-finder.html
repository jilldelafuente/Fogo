<style>
:root{
  --coal:#17120F;
  --smoke:#221B16;
  --smoke-2:#2C231C;
  --ember:#E2542B;
  --gold:#E0A93B;
  --moss:#7C8B6A;
  --bone:#F4EFE5;
  --bone-dim:rgba(244,239,229,.55);
  --bone-faint:rgba(244,239,229,.22);
  --display:'Fraunces',Georgia,serif;
  --ui:'Archivo','Helvetica Neue',Arial,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--coal);
  color:var(--bone);
  font-family:var(--ui);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overflow-x:hidden;
}

/* ambient ground-fire glow */
body::after{
  content:'';position:fixed;left:50%;bottom:-40vh;transform:translateX(-50%);
  width:120vw;height:70vh;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at center,rgba(226,84,43,.16),transparent 62%);
}

.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 28px}

/* ── nav ── */
nav{display:flex;align-items:center;justify-content:space-between;padding:26px 0 0}
.mark{font-family:var(--display);font-size:19px;letter-spacing:.16em;text-transform:uppercase;font-weight:400}
.mark em{font-style:normal;color:var(--ember)}
.nav-links{display:flex;gap:30px}
.nav-links a{color:var(--bone-dim);text-decoration:none;font-size:13px;letter-spacing:.05em}
.nav-links a:hover{color:var(--bone)}

/* ── hero ── */
.hero{padding:74px 0 0;text-align:center}

.eyebrow{
  font-size:11px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--ember);margin-bottom:30px;
}

.ask{
  font-family:var(--display);
  font-size:clamp(30px,4.6vw,52px);
  font-weight:300;line-height:1.1;
  font-variation-settings:'SOFT' 40;
  margin-bottom:44px;
  transition:opacity .35s ease;
}

/* ── the input: signature element ── */
.field{position:relative;max-width:800px;margin:0 auto}

.field input{
  width:100%;background:none;border:0;outline:0;
  font-family:var(--display);font-weight:300;
  font-size:clamp(30px,5.4vw,62px);
  color:var(--bone);text-align:center;
  padding:6px 0 22px;
}
.field input::placeholder{color:transparent}

.ghost{
  position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;
  font-family:var(--display);font-weight:300;
  font-size:clamp(30px,5.4vw,62px);
  color:rgba(244,239,229,.19);
  padding-top:6px;pointer-events:none;
}
.ghost.hide{opacity:0}
.caret{
  display:inline-block;width:2px;height:.82em;background:var(--ember);
  margin-left:4px;vertical-align:-.08em;animation:blink 1.1s steps(1) infinite;
}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

/* ground fire */
.ground{position:relative;height:2px;background:var(--bone-faint);overflow:visible}
.ground::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,var(--gold) 22%,var(--ember) 50%,var(--gold) 78%,transparent);
  transform:scaleX(0);transform-origin:center;
  transition:transform .55s cubic-bezier(.2,.7,.3,1);
}
.ground::after{
  content:'';position:absolute;left:0;right:0;top:-14px;height:30px;
  background:radial-gradient(ellipse at center,rgba(226,84,43,.5),transparent 70%);
  opacity:0;transition:opacity .55s ease;filter:blur(7px);
}
.field.lit .ground::before{transform:scaleX(1)}
.field.lit .ground::after{opacity:1}

/* ── chips ── */
.chips{margin:46px auto 0;max-width:900px;transition:opacity .3s ease}
.chip-row{
  display:flex;align-items:center;justify-content:center;
  flex-wrap:wrap;gap:9px;margin-bottom:14px;
}
.row-label{
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--bone-dim);width:112px;text-align:right;padding-right:12px;flex-shrink:0;
}
.chip{
  font-family:var(--ui);font-size:13.5px;color:var(--bone);
  background:none;border:1px solid var(--bone-faint);border-radius:100px;
  padding:8px 17px;cursor:pointer;
  transition:border-color .2s,background .2s,color .2s,transform .2s;
}
.chip:hover,.chip:focus-visible{transform:translateY(-2px)}
.chip[data-cat="celebrate"]:hover,.chip[data-cat="celebrate"]:focus-visible{border-color:var(--ember);background:rgba(226,84,43,.13)}
.chip[data-cat="business"]:hover,.chip[data-cat="business"]:focus-visible{border-color:var(--gold);background:rgba(224,169,59,.13)}
.chip[data-cat="everyday"]:hover,.chip[data-cat="everyday"]:focus-visible{border-color:var(--moss);background:rgba(124,139,106,.16)}

/* ── results ── */
.results{margin:0 auto;max-width:1180px;display:none;padding-bottom:90px}
.results.on{display:block}

.answer{
  font-family:var(--display);font-weight:300;
  font-size:clamp(26px,3.7vw,42px);line-height:1.15;
  text-align:center;margin:64px auto 8px;max-width:820px;
}
.answer b{font-weight:600;font-style:italic;color:var(--gold)}
.answer-note{
  text-align:center;color:var(--bone-dim);font-size:14.5px;
  max-width:520px;margin:0 auto 46px;line-height:1.6;
}

.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

.card{
  background:var(--smoke);border:1px solid rgba(244,239,229,.07);
  border-radius:3px;padding:26px 22px 24px;
  opacity:0;transform:translateY(16px);
  animation:deal .5s cubic-bezier(.2,.7,.3,1) forwards;
}
.card:nth-child(1){animation-delay:.05s}
.card:nth-child(2){animation-delay:.13s}
.card:nth-child(3){animation-delay:.21s}
.card:nth-child(4){animation-delay:.29s}
@keyframes deal{to{opacity:1;transform:none}}

.card-label{
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ember);margin-bottom:15px;
}
.card-value{
  font-family:var(--display);font-weight:400;font-size:23px;
  line-height:1.2;margin-bottom:9px;
}
.card-sub{font-size:13.5px;color:var(--bone-dim);line-height:1.55}

.slots{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.slot{
  font-size:12.5px;font-family:var(--ui);color:var(--bone);
  border:1px solid var(--bone-faint);border-radius:2px;
  padding:6px 11px;cursor:pointer;transition:.18s;
}
.slot:hover,.slot:focus-visible{border-color:var(--gold);background:rgba(224,169,59,.13)}
.slot.picked{border-color:var(--gold);background:var(--gold);color:var(--coal);font-weight:600}

.add{
  display:flex;align-items:center;gap:10px;
  padding:10px 0;border-top:1px solid rgba(244,239,229,.07);
  font-size:13.5px;color:var(--bone-dim);cursor:pointer;transition:color .18s;
}
.add:first-of-type{border-top:0;padding-top:2px}
.add:hover{color:var(--bone)}
.box{
  width:15px;height:15px;border:1px solid var(--bone-faint);border-radius:2px;
  flex-shrink:0;position:relative;transition:.18s;
}
.add.on .box{background:var(--ember);border-color:var(--ember)}
.add.on .box::after{
  content:'';position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;
  border:solid var(--coal);border-width:0 2px 2px 0;transform:rotate(42deg);
}
.add.on{color:var(--bone)}

/* ── cta ── */
.foot{text-align:center;margin-top:44px}
.cta{
  font-family:var(--ui);font-size:14px;font-weight:600;letter-spacing:.05em;
  background:var(--ember);color:var(--bone);border:0;border-radius:2px;
  padding:17px 46px;cursor:pointer;transition:.2s;
}
.cta:hover{background:#F0663C;transform:translateY(-1px)}
.reset{
  display:block;margin:20px auto 0;background:none;border:0;cursor:pointer;
  font-family:var(--ui);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--bone-dim);border-bottom:1px solid transparent;padding-bottom:3px;
}
.reset:hover{color:var(--bone);border-bottom-color:var(--bone-faint)}

:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

@media (max-width:900px){
  .rail{grid-template-columns:repeat(2,1fr)}
  .row-label{width:100%;text-align:center;padding:0 0 4px}
  .nav-links{display:none}
  .hero{padding-top:48px}
}
@media (max-width:560px){
  .rail{grid-template-columns:1fr}
}

/* ── cuts section ── */
.cuts-section{max-width:1180px;margin:0 auto;padding:70px 28px 100px;border-top:1px solid rgba(244,239,229,.08)}
.cuts-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:8px}
.cuts-eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--ember)}
.cuts-title{font-family:var(--display);font-weight:300;font-size:clamp(28px,3.4vw,40px)}
.spectrum-axis{display:flex;justify-content:space-between;margin:26px 0 8px}
.spectrum-axis span{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--bone-dim)}
.spectrum-track{height:1px;background:linear-gradient(90deg,rgba(244,239,229,.1),rgba(226,84,43,.55));margin-bottom:22px}

.cuts-row{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory}
.cuts-row::-webkit-scrollbar{height:5px}
.cuts-row::-webkit-scrollbar-thumb{background:rgba(244,239,229,.14);border-radius:4px}

.cut-card{
  flex:0 0 176px;scroll-snap-align:start;
  background:var(--smoke);border:1px solid rgba(244,239,229,.07);border-radius:3px;
  overflow:hidden;transition:transform .2s,border-color .2s;
}
.cut-card:hover{transform:translateY(-4px);border-color:rgba(244,239,229,.2)}
.cut-portrait{width:100%;height:104px;display:block;border-bottom:1px solid rgba(244,239,229,.06)}
.cut-card-name{font-family:var(--display);font-size:16.5px;padding:13px 14px 2px}
.cut-card-taste{font-size:11.5px;color:var(--bone-dim);padding:0 14px 14px;line-height:1.4}

.cuts-foot{text-align:center;margin-top:30px}
.cuts-link{
  font-family:var(--ui);font-size:13px;letter-spacing:.05em;color:var(--bone);
  text-decoration:none;border-bottom:1px solid var(--bone-faint);padding-bottom:3px;
  transition:border-color .2s,color .2s;
}
.cuts-link:hover{border-color:var(--gold);color:var(--gold)}

@media (max-width:700px){
  .cuts-head{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .card{opacity:1;transform:none}
}
</style>

<div class="wrap">
  <nav>
    <div class="mark">Fogo <em>de</em> Chão</div>
    <div class="nav-links">
      <a href="#">Menu</a><a href="#">Locations</a><a href="#">Fogo To-Go</a><a href="#">Private Events</a>
    </div>
  </nav>

  <section class="hero">

    <div class="field" id="field">

      </div>

        <button class="chip" data-cat="business" data-k="client">Client dinner</button>
        <button class="chip" data-cat="business" data-k="team">Team dinner</button>

      <button class="cta" id="cta">Reserve this table</button>
      <button class="reset" id="reset">Start over</button>
    </div>
  </section>

  <section class="cuts-section">
    <div class="cuts-head">
      <div>
        <div class="cuts-eyebrow">Fire is the beginning</div>

    <div class="spectrum-track"></div>
    <div class="cuts-row" id="cutsRow"></div>
    <div class="cuts-foot"><a href="#" class="cuts-link">See all 17 cuts →</a></div>
  </section>
</div>

<script>
const DATA = {
  birthday:{ hit:["birthday","bday","b-day","turning"],
    answer:"Here's how Fogo does a <b>birthday</b>.",
    note:"The gaúcho chefs will find your table. There is no discreet option.",
    exp:"Full Churrasco", expSub:"Continuous carving, Market Table, the works.",
    table:"Best for 6 to 12", tableSub:"Round tables hold the room together.",
    slots:["6:45","7:15","8:30"],
    adds:[["Cheesecake Brûlée, one candle",1],["Caipirinha toast for the table",0],["Wine pairing",0]] },

  anniversary:{ hit:["anniversary","anniversaries"],
    answer:"Here's how Fogo does an <b>anniversary</b>.",
    note:"Quieter corner, longer courses, nothing rushed.",
    exp:"Full Churrasco + Wagyu", expSub:"Upgraded cuts, carved at your pace.",
    table:"Table for two", tableSub:"Request a booth along the wall.",
    slots:["6:30","7:45","8:15"],
    adds:[["Butter-bathed lobster tail",1],["Malbec pairing",0],["Tres Leches",0]] },

  graduation:{ hit:["graduation","graduate","grad","commencement"],
    answer:"Here's how Fogo does a <b>graduation</b>.",
    note:"Two generations, one price, zero menu negotiation.",
    exp:"Full Churrasco", expSub:"One prix fixe covers everyone at the table.",
    table:"Best for 8 to 20", tableSub:"Semi-private seating available.",
    slots:["5:30","6:00","7:30"],
    adds:[["Dessert for the table",1],["Reserved photo moment",0]] },

  holiday:{ hit:["holiday","christmas","new year","office party","xmas"],
    answer:"Here's how Fogo does a <b>holiday party</b>.",
    note:"Book the room, not the table. December fills by early November.",
    exp:"Private Events", expSub:"Buyouts and semi-private rooms.",
    table:"20 to 100 guests", tableSub:"Dedicated event manager assigned.",
    slots:["5:00","6:30","8:00"],
    adds:[["Passed appetizers at Bar Fogo",1],["Open bar package",0],["AV for a toast",0]] },

  client:{ hit:["client","business dinner","work dinner","prospect","deal"],
    answer:"Here's how Fogo does a <b>client dinner</b>.",
    note:"No menus to read, no orders to place. The conversation never stops.",
    exp:"Full Churrasco", expSub:"Tableside service means no ordering pauses.",
    table:"Best for 4 to 8", tableSub:"Private dining on request.",
    slots:["6:00","6:30","7:00"],
    adds:[["Wine pairing",1],["Seafood tower to start",0],["One check, discreetly",1]] },

  team:{ hit:["team","staff","colleague","offsite","coworker","company"],
    answer:"Here's how Fogo does a <b>team dinner</b>.",
    note:"Every dietary preference is already handled. Nobody has to ask.",
    exp:"Full Churrasco", expSub:"Market Table is naturally gluten-free.",
    table:"Best for 10 to 30", tableSub:"Private room at 15 or more.",
    slots:["5:30","6:30","7:15"],
    adds:[["Pre-set bar tab",1],["Dessert for the table",0]] },

  group:{ hit:["group","party of","large","reunion","family reunion","wedding","rehearsal","shower"],
    answer:"Here's how Fogo does a <b>big group</b>.",
    note:"Whatever the headcount, the price per person doesn't move.",
    exp:"Private Events", expSub:"Semi-private rooms and full buyouts.",
    table:"15 to 100 guests", tableSub:"Event manager assigned at booking.",
    slots:["5:00","6:00","7:30"],
    adds:[["Passed appetizers",1],["Bar package",0],["Custom dessert display",0]] },

  date:{ hit:["date","romantic","first date","girls night","dinner for two"],
    answer:"Here's how Fogo does a <b>date night</b>.",
    note:"You do not have to commit to the full churrasco. Most people don't know that.",
    exp:"Bar Fogo", expSub:"À la carte plates, cocktails, no prix fixe.",
    table:"Table for two", tableSub:"Bar seating, walk-ins usually fine.",
    slots:["7:30","8:00","8:45"],
    adds:[["Seafood tower",1],["Caipirinha flight",0]] },

  brunch:{ hit:["brunch","weekend","sunday","saturday","mother","father"],
    answer:"Here's how Fogo does <b>weekend brunch</b>.",
    note:"Yes, there is brunch. It runs Saturday and Sunday.",
    exp:"Weekend Brunch", expSub:"Brunch plates plus the full Market Table.",
    table:"Any size", tableSub:"Kids under 6 eat free.",
    slots:["11:00","12:15","1:30"],
    adds:[["Bottomless mimosas",1],["Brazilian pão de queijo",0]] },

  latenight:{ hit:["late","late night","nightcap","after","drinks"],
    answer:"Here's how Fogo does a <b>late night</b>.",
    note:"The bar stays open past the dining room. Different menu, different mood.",
    exp:"Bar Fogo", expSub:"Small plates and cocktails, à la carte.",
    table:"Bar or lounge", tableSub:"No reservation needed.",
    slots:["9:00","9:45","10:30"],
    adds:[["Picanha sliders",1],["Cachaça tasting",0]] },

  solo:{ hit:["solo","alone","myself","lunch","quick","work lunch","one person"],
    answer:"Here's how Fogo does <b>lunch, solo</b>.",
    note:"The Market Table on its own is a full meal. You never have to touch the meat.",
    exp:"Market Table only", expSub:"Seasonal salads, imported cheeses, exotic fruit.",
    table:"One seat", tableSub:"Bar seating, in and out in 45 minutes.",
    slots:["11:30","12:00","1:00"],
    adds:[["Add one cut of the day",0],["Espresso to finish",0]] },

  justbecause:{ hit:["just because","nothing","random","tuesday","weeknight","no reason","casual","hungry"],
    answer:"Here's how Fogo does a <b>Tuesday</b>.",
    note:"No occasion required. This is the part of the menu nobody knows about.",
    exp:"Market Table only", expSub:"A full meal without a single skewer.",
    table:"Two to four", tableSub:"Walk in. Sit anywhere.",
    slots:["6:00","7:00","8:15"],
    adds:[["Add the Full Churrasco later",0],["Happy hour at Bar Fogo",1]] },

  kids:{ hit:["kid","kids","family","children","child","toddler"],
    answer:"Here's how Fogo does a <b>family dinner</b>.",
    note:"Kids 6 and under eat free. Ages 7 to 12 are half price.",
    exp:"Full Churrasco", expSub:"Market Table keeps everyone fed while you wait.",
    table:"Best for 4 to 8", tableSub:"High chairs and boosters available.",
    slots:["5:00","5:30","6:15"],
    adds:[["Pão de queijo up front",1],["Dessert to share",0]] },

  diet:{ hit:["vegetarian","vegan","gluten","celiac","pescatarian","dietary","allerg","keto","low carb"],
    answer:"Here's how Fogo handles <b>dietary needs</b>.",
    note:"The Market Table is naturally gluten-free. This is not an accommodation, it's the menu.",
    exp:"Market Table only", expSub:"30+ items, seasonal, no meat required.",
    table:"Any size", tableSub:"Tell the host, they'll route the chefs.",
    slots:["6:00","7:15","8:00"],
    adds:[["Grilled seafood option",0],["Ask about the vegetarian skewer",1]] }
};

const FALLBACK = {
  answer:"Fogo can build around <b>that</b>.",
  note:"Give us a headcount and a night, or start with one of the occasions below.",
  exp:"Full Churrasco", expSub:"The experience that made Fogo famous.",
  table:"Any size", tableSub:"Two people or two hundred.",
  slots:["6:00","7:00","8:00"],
  adds:[["Market Table only",0],["Bar Fogo, à la carte",0]]
};

const PLACEHOLDERS = ["Birthday.","Client dinner.","Just a Tuesday.","Anniversary.","Vegetarian, party of 6."];

const input=document.getElementById('input'), field=document.getElementById('field'),
      ghost=document.getElementById('ghost'), gtext=document.getElementById('ghostText'),
      ask=document.getElementById('ask'), chips=document.getElementById('chips'),
      results=document.getElementById('results'), answer=document.getElementById('answer'),
      note=document.getElementById('note'), rail=document.getElementById('rail');

/* typing placeholder */
let pi=0,ci=0,del=false,timer;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function type(){
  if(input.value){return}
  const w=PLACEHOLDERS[pi];
  gtext.textContent=del?w.slice(0,ci--):w.slice(0,ci++);
  let d=del?38:78;
  if(!del&&ci>w.length){del=true;d=1500}
  if(del&&ci<0){del=false;ci=0;pi=(pi+1)%PLACEHOLDERS.length;d=280}
  timer=setTimeout(type,d);
}
if(reduce){gtext.textContent=PLACEHOLDERS[0]}else{type()}

input.addEventListener('focus',()=>field.classList.add('lit'));
input.addEventListener('blur',()=>{if(!input.value)field.classList.remove('lit')});
input.addEventListener('input',()=>ghost.classList.toggle('hide',!!input.value));
input.addEventListener('keydown',e=>{if(e.key==='Enter')go(input.value)});

document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  input.value=c.textContent; ghost.classList.add('hide'); field.classList.add('lit'); go(c.dataset.k,true);
}));

function match(q){
  if(DATA[q])return DATA[q];
  const s=q.toLowerCase().trim();
  if(!s)return null;
  for(const k in DATA) if(DATA[k].hit.some(h=>s.includes(h))) return DATA[k];
  return FALLBACK;
}

function go(q,isKey){
  const d=match(isKey?q:q);
  if(!d)return;
  clearTimeout(timer);
  ask.style.opacity=.25; chips.style.opacity=.35;
  answer.innerHTML=d.answer; note.textContent=d.note;
  rail.innerHTML=`
    <div class="card"><div class="card-label">The experience</div>
      <div class="card-value">${d.exp}</div><div class="card-sub">${d.expSub}</div></div>
    <div class="card"><div class="card-label">The table</div>
      <div class="card-value">${d.table}</div><div class="card-sub">${d.tableSub}</div></div>
    <div class="card"><div class="card-label">Tonight</div>
      <div class="card-value">Available</div>
      <div class="slots">${d.slots.map((s,i)=>`<button class="slot${i===1?' picked':''}">${s}</button>`).join('')}</div></div>
    <div class="card"><div class="card-label">Make it more</div>
      ${d.adds.map(a=>`<div class="add${a[1]?' on':''}"><span class="box"></span><span>${a[0]}</span></div>`).join('')}</div>`;
  rail.querySelectorAll('.slot').forEach(s=>s.addEventListener('click',()=>{
    rail.querySelectorAll('.slot').forEach(x=>x.classList.remove('picked')); s.classList.add('picked');
  }));
  rail.querySelectorAll('.add').forEach(a=>a.addEventListener('click',()=>a.classList.toggle('on')));
  results.classList.add('on');
  results.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
}

document.getElementById('reset').addEventListener('click',()=>{
  input.value='';ghost.classList.remove('hide');field.classList.remove('lit');
  results.classList.remove('on');ask.style.opacity=1;chips.style.opacity=1;
  ci=0;del=false;if(!reduce)type();
  window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
});

document.getElementById('cta').addEventListener('click',function(){
  this.textContent='Table held';this.style.background='var(--moss)';
  setTimeout(()=>{this.textContent='Reserve this table';this.style.background='';},1800);
});

/* ── homepage cut spectrum: 6 cuts, evenly spread, no detail state ── */
const HOME_CUTS=[
 {n:"Filet Mignon",m:.07,t:"Lean and mild"},
 {n:"Alcatra",m:.24,t:"Traditional, whole"},
 {n:"Picanha",m:.44,t:"The signature cut"},
 {n:"Fraldinha",m:.62,t:"Bold marbling"},
 {n:"Beef Ancho",m:.82,t:"Grilled over direct heat"},
 {n:"Costela",m:.96,t:"Hours over fire"}
];

function homePortrait(m,seed){
  let s=seed*9301+49297;
  const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};
  const veins=Math.round(3+m*14);
  let g='';
  for(let i=0;i<veins;i++){
    const y=10+rnd()*66, x=10+rnd()*24, w=16+rnd()*70;
    const c1=y-5-rnd()*9, c2=y+5+rnd()*9;
    g+=`<path d="M${x},${y} C${x+w*.33},${c1} ${x+w*.66},${c2} ${x+w},${y-2+rnd()*3}"
        stroke="rgba(246,232,214,${.22+m*.4})" stroke-width="${.6+rnd()*(.5+m*1.2)}" fill="none" stroke-linecap="round"/>`;
  }
  const hue=`hsl(${8+m*5} ${44+m*14}% ${26+(1-m)*7}%)`;
  return `<svg class="cut-portrait" viewBox="0 0 176 104" preserveAspectRatio="none" aria-hidden="true">
    <defs><clipPath id="hc${seed}"><path d="M12,22 C42,7 134,8 160,24 C168,40 168,74 158,90 C128,104 42,103 14,88 C6,72 6,38 12,22 Z"/></clipPath></defs>
    <rect width="176" height="104" fill="#1B1511"/>
    <g clip-path="url(#hc${seed})">
      <rect width="176" height="104" fill="${hue}"/>${g}
      <path d="M12,22 C42,7 134,8 160,24 C168,40 168,74 158,90 C128,104 42,103 14,88 C6,72 6,38 12,22 Z"
        fill="none" stroke="rgba(58,28,16,.85)" stroke-width="8"/>
    </g>
  </svg>`;
}

document.getElementById('cutsRow').innerHTML = HOME_CUTS.map((c,i)=>`
  <div class="cut-card">
    ${homePortrait(c.m,i+1)}
    <div class="cut-card-name">${c.n}</div>
    <div class="cut-card-taste">${c.t}</div>
  </div>`).join('');
</script>
